name: collect

on:
  schedule:
    # Every 2 hours at :41 (odd UTC hours) so time-limited offers are caught early (D-011).
    - cron: "41 1-23/2 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Headless browser for render sources
        run: pip install playwright==1.65.2 && python -m playwright install --with-deps chromium
      - name: Telegram inbox (no-op without secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notify.telegram inbox || echo "telegram inbox failed, continuing"
      - name: Collect
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m collector
      - name: Prune old data
        run: python -m collector.prune
      - name: Instant alerts for time-limited offers (no-op without secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notify.flash || echo "flash failed, continuing"
      - name: Commit data
        env:
          SUMMARY: ${{ steps.collect.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          for f in memory/inbox.jsonl memory/telegram_offset.json; do [ ! -f "$f" ] || git add "$f"; done
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "${SUMMARY:-collect: update}"
          git pull --rebase --autostash
          git push
